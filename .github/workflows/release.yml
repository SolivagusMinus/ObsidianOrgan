# Builds the plugin and publishes a GitHub release whenever the version in
# manifest.json changes on the repository's default branch (whatever it is named). BRAT (and Obsidian itself)
# install plugins from these releases: main.js, manifest.json, styles.css.
name: Release

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    # Only the default branch publishes releases (BRAT reads manifest.json from it).
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Read version
        id: version
        run: |
          version=$(node -p "require('./manifest.json').version")
          pkg=$(node -p "require('./package.json').version")
          if [ "$version" != "$pkg" ]; then
            echo "::error::manifest.json ($version) and package.json ($pkg) versions differ"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Skip if this version is already released
        id: exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "${{ steps.version.outputs.version }}" > /dev/null 2>&1; then
            echo "Release ${{ steps.version.outputs.version }} already exists — nothing to do."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and test
        if: steps.exists.outputs.skip != 'true'
        run: |
          npm ci
          npm run build
          npm test

      - name: Publish release
        if: steps.exists.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          v="${{ steps.version.outputs.version }}"
          gh release create "$v" main.js manifest.json styles.css \
            --target "$GITHUB_SHA" \
            --title "Folder Hub $v" \
            --notes "Установка через BRAT: Add beta plugin → ${{ github.repository }}"
